services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mama
      POSTGRES_PASSWORD: mama_secret
      POSTGRES_DB: raqib_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mama -d raqib_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://mama:mama_secret@db:5432/raqib_agent
      - DATABASE_URL_SYNC=postgresql://mama:mama_secret@db:5432/raqib_agent
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://mama:mama_secret@db:5432/raqib_agent
      - DATABASE_URL_SYNC=postgresql://mama:mama_secret@db:5432/raqib_agent
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info

volumes:
  postgres_data:
