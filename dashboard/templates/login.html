{% extends "base.html" %}
{% block title %}Login - Mama Sales Agent{% endblock %}

{% block content %}
<article style="max-width: 450px; margin: 2rem auto;">
    <header>
        <h2>Welcome to Mama Sales Agent</h2>
        <p>AI-powered sales chatbot for your Facebook page</p>
    </header>

    <div id="error-msg" style="display:none; color: #721c24; background: #f8d7da; padding: 0.7rem 1rem; border-radius: 0.3rem; margin-bottom: 1rem;"></div>
    <div id="success-msg" style="display:none; color: #155724; background: #d4edda; padding: 0.7rem 1rem; border-radius: 0.3rem; margin-bottom: 1rem;"></div>

    <form id="auth-form">
        <div id="name-field">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name">
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" value="jubair@test.com">

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Password" value="test123">

        <div class="grid">
            <button type="submit" id="login-btn">Login</button>
            <button type="button" id="register-btn" class="secondary">Register</button>
        </div>
    </form>

    <hr>
    <details>
        <summary>Demo credentials</summary>
        <p><strong>Email:</strong> jubair@test.com<br><strong>Password:</strong> test123</p>
    </details>
</article>

<script>
// If already logged in, go to dashboard
const existingToken = localStorage.getItem('token');
if (existingToken) {
    // Verify token is still valid
    fetch('/api/auth/me', {headers: {'Authorization': 'Bearer ' + existingToken}})
        .then(r => { if (r.ok) window.location.href = '/dashboard'; else localStorage.removeItem('token'); })
        .catch(() => localStorage.removeItem('token'));
}

const errorEl = document.getElementById('error-msg');
const successEl = document.getElementById('success-msg');

function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    successEl.style.display = 'none';
}

function showSuccess(msg) {
    successEl.textContent = msg;
    successEl.style.display = 'block';
    errorEl.style.display = 'none';
}

document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    errorEl.style.display = 'none';

    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await resp.json();
        if (resp.ok) {
            localStorage.setItem('token', data.access_token);
            showSuccess('Login successful! Redirecting...');
            setTimeout(() => window.location.href = '/dashboard', 500);
        } else {
            showError(data.detail || 'Login failed. Check your credentials.');
        }
    } catch(e) {
        showError('Network error. Is the server running?');
    }
});

document.getElementById('register-btn').addEventListener('click', async () => {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!name) { showError('Name is required for registration'); return; }
    if (!email) { showError('Email is required'); return; }
    if (!password || password.length < 4) { showError('Password must be at least 4 characters'); return; }

    try {
        const resp = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, email, password})
        });
        const data = await resp.json();
        if (resp.ok) {
            localStorage.setItem('token', data.access_token);
            showSuccess('Account created! Redirecting...');
            setTimeout(() => window.location.href = '/dashboard', 500);
        } else {
            showError(data.detail || 'Registration failed.');
        }
    } catch(e) {
        showError('Network error. Is the server running?');
    }
});
</script>
{% endblock %}
