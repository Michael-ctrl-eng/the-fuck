{% extends "base.html" %}
{% block title %}Login - Mama Sales Agent{% endblock %}

{% block content %}
<article style="max-width: 400px; margin: 2rem auto;">
    <header>
        <h2>Login / Register</h2>
    </header>

    <div id="error-msg" style="display:none; color: var(--pico-del-color);"></div>

    <form id="auth-form">
        <label for="name">Name (for registration only)</label>
        <input type="text" id="name" name="name" placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Password">

        <div class="grid">
            <button type="submit" id="login-btn">Login</button>
            <button type="button" id="register-btn" class="secondary">Register</button>
        </div>
    </form>
</article>

<script>
const API = '';
const errorEl = document.getElementById('error-msg');

function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
}

document.getElementById('login-btn').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
        const resp = await fetch(`${API}/api/auth/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await resp.json();
        if (resp.ok) {
            localStorage.setItem('token', data.access_token);
            window.location.href = '/dashboard';
        } else {
            showError(data.detail || 'Login failed');
        }
    } catch(e) { showError('Network error'); }
});

document.getElementById('register-btn').addEventListener('click', async () => {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if (!name) { showError('Name is required for registration'); return; }
    try {
        const resp = await fetch(`${API}/api/auth/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, email, password})
        });
        const data = await resp.json();
        if (resp.ok) {
            localStorage.setItem('token', data.access_token);
            window.location.href = '/dashboard';
        } else {
            showError(data.detail || 'Registration failed');
        }
    } catch(e) { showError('Network error'); }
});
</script>
{% endblock %}
